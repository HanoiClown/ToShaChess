name: Windows checks and build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run setup:engine
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:content
      - run: npm run build
      - run: npm run test:ui
      - run: npm run package:win
      - run: node scripts/smoke-portable.mjs
      - name: Include corresponding application source
        run: git archive --format=zip --output=release/win-unpacked/ToShaChess-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ToShaChess-Windows
          path: release/win-unpacked/
          retention-days: 14
